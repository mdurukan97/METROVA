name: Defold Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - defold-reboot

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download pinned Defold Bob
        run: |
          mkdir -p tools
          curl -fL --retry 3 \
            https://github.com/defold/defold/releases/download/1.13.1/bob.jar \
            -o tools/bob.jar
          echo "8f2b1381fd4d0fb92816403cd0056cb7db5ad4083615be8dcc2d868fb4939938  tools/bob.jar" | sha256sum -c -

      - name: Build ARM64 debug APK
        run: |
          mkdir -p dist/android
          java -jar tools/bob.jar \
            --platform armv7-android \
            --architectures arm64-android \
            --variant debug \
            --archive \
            --bundle-format apk \
            --bundle-output dist/android \
            resolve distclean build bundle

      - name: Inspect output
        run: find dist/android -maxdepth 4 -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: METROVA-Defold-debug-apk
          path: dist/android/**/*.apk
          if-no-files-found: error
          retention-days: 14

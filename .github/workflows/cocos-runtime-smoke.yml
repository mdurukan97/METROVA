name: Cocos Runtime Web Smoke Build

on:
  workflow_run:
    workflows: ["Validate Cocos Rewrite"]
    types: [completed]
    branches: [cocos-rewrite]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-cocos-rewrite
  cancel-in-progress: true

jobs:
  build-web-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Download validated Istanbul atlas
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: istanbul-night-atlas
          path: cocos/assets/data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare METROVA runtime data
        shell: pwsh
        working-directory: cocos
        run: |
          npm install
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            npm run runtime:prepare
          } else {
            npm run runtime:sync
          }
          npm run runtime:validate
          npx tsc --noEmit
          npm test

      - name: Build pinned Cocos CLI
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/cocos/cocos-cli.git "$env:RUNNER_TEMP/cocos-cli"
          Set-Location "$env:RUNNER_TEMP/cocos-cli"
          git checkout 4aeaf59a7d7694a69e753ed7d2c649d98eb18134
          npm install -g node-gyp
          npm run init
          npm install
          npm run download-tools
          npm run build

      - name: Import and build actual Cocos runtime
        shell: pwsh
        run: |
          $cli="$env:RUNNER_TEMP/cocos-cli/dist/cli.js"
          $project="$env:GITHUB_WORKSPACE/cocos"
          node $cli --no-interactive import --project $project
          node $cli --no-interactive build --project $project --platform web-mobile --log-dest "$env:GITHUB_WORKSPACE/cocos-runtime-build.log"
          Get-ChildItem -Path "$project/build" -Recurse | Select-Object FullName,Length

      - name: Upload web runtime
        uses: actions/upload-artifact@v4
        with:
          name: METROVA-Cocos-Web-Runtime
          path: |
            cocos/build/**
            cocos-runtime-build.log
          retention-days: 7

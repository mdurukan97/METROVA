name: Build METROVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.gd'
      - '**/*.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v7.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Normalize artifact filename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          APK=$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' | head -n 1)
          test -n "${APK:-}"
          cp "$APK" artifact/METROVA_v0.1_debug.apk
          sha256sum artifact/METROVA_v0.1_debug.apk > artifact/METROVA_v0.1_debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: METROVA-Android-v0.1
          path: artifact/*
          retention-days: 7
